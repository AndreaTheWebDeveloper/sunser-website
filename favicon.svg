    <g fill="#8fd5e5">
      <rect x="15"   y="9" width="8.6" height="54"/>
      <rect x="25.6" y="9" width="8.6" height="54"/>
      <rect x="36.2" y="9" width="8.6" height="54"/>
      <rect x="46.8" y="9" width="8.6" height="54"/>
      <rect x="57.4" y="9" width="8.6" height="54"/>
      <rect x="68"   y="9" width="8.6" height="54"/>
      <rect x="78.6" y="9" width="8.4" height="54"/>
    </g>
    <g stroke="#f0e504" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M43,20 Q52,15 59,18 Q66,21 72,18"/>
      <path d="M44,26 Q53,27 59,32 Q64,36 70,37"/>
      <path d="M40,32 Q46,38 47,45 Q48,52 53,56"/>
      <path d="M31,35 Q33,42 29,48 Q26,53 28,58"/>
      <path d="M26,17 Q23,13 21,11"/>
      <path d="M33,14 Q33,10 32,7"/>
      <path d="M41,16 Q45,11 49,9"/>
      <path d="M24,24 Q19,23 16,21"/>
      <path d="M25,31 Q21,34 18,35"/>
