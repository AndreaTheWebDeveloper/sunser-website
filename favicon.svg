      font-size="10.5" font-weight="800" letter-spacing="2.4"><tspan fill="#1b1b1b">SUNS</tspan><tspan fill="#c1272d">ER</tspan></text>
  </g>

  <!-- left casement -->
  <g transform="skewY(-6) translate(-7,6)">
    <rect x="3" y="2" width="14" height="82" rx="1.5" fill="#f4f4f4" stroke="#b5b5b5" stroke-width="1"/>
