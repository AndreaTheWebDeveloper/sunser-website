<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -9 106 106" role="img" aria-label="Sunser">
  <title>Sunser</title>
  <defs>
    <clipPath id="winClipF"><rect x="15" y="9" width="72" height="68"/></clipPath>
  </defs>

  <!-- main window frame -->
  <rect x="10" y="4" width="82" height="78" rx="2" fill="#fdfdfd" stroke="#adadad" stroke-width="1.2"/>
  <rect x="14" y="8" width="74" height="70" fill="none" stroke="#d8d8d8" stroke-width="1"/>

