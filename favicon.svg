      <polygon points="47,63 70,28 70,63"/>
      <rect x="73" y="21" width="11" height="42"/>
    </g>
    <rect x="15" y="63" width="72" height="14" fill="#ffffff"/>
    <text x="51" y="74" text-anchor="middle"
