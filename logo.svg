<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 88" width="316" height="88" role="img" aria-label="Sunser — Infissi e Serramenti Roma">
  <title>Sunser — Infissi e Serramenti</title>
  <defs>
    <clipPath id="winClip"><rect x="26" y="12" width="60" height="62"/></clipPath>
  </defs>

  <!-- ══ CORNICE CENTRALE (doppio bordo + profondità) ══ -->
  <rect x="20" y="6" width="72" height="74" rx="1.5" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.4"/>
  <rect x="26" y="12" width="60" height="62" fill="none" stroke="#c9c9c9" stroke-width="1"/>
  <line x1="20" y1="6"  x2="26" y2="12" stroke="#d5d5d5" stroke-width="1"/>
  <line x1="92" y1="6"  x2="86" y2="12" stroke="#d5d5d5" stroke-width="1"/>
  <line x1="20" y1="80" x2="26" y2="74" stroke="#d5d5d5" stroke-width="1"/>
  <line x1="92" y1="80" x2="86" y2="74" stroke="#d5d5d5" stroke-width="1"/>

  <!-- ══ SCENA INTERNA ══ -->
  <g clip-path="url(#winClip)">
    <rect x="26" y="12" width="60" height="62" fill="#ffffff"/>
    <!-- cielo a pannelli con sottili linee bianche verticali -->
    <g fill="#a6d9e8">
      <rect x="26"   y="12" width="9" height="62"/>
      <rect x="36.2" y="12" width="9" height="62"/>
      <rect x="46.4" y="12" width="9" height="62"/>
      <rect x="56.6" y="12" width="9" height="62"/>
      <rect x="66.8" y="12" width="9" height="62"/>
      <rect x="77"   y="12" width="9" height="62"/>
    </g>

    <!-- raggi ondulati del sole, verso destra e in basso -->
    <g stroke="#f2e500" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M51,22 Q60,17 67,21 Q74,24 80,21"/>
      <path d="M51,29 Q59,31 64,36 Q69,41 76,42"/>
      <path d="M47,35 Q53,41 53,48 Q53,55 59,59"/>
      <path d="M38,42 Q40,49 36,54 Q33,58 35,62"/>
      <path d="M28,38 Q25,42 21,44"/>
    </g>
    <!-- nucleo del sole: stella a punte irregolari -->
    <path fill="#f2e500" d="M39.0,16.9 40.5,23.4 45.4,17.9 43.0,25.0 49.9,22.7 44.8,27.4 50.4,29.0 45.0,30.6 48.9,34.7 43.3,33.3 44.7,38.9 40.5,34.5 39.0,41.3 37.3,35.4 33.2,39.0 34.9,33.1 27.9,35.4 32.5,30.7 26.3,29.0 33.1,27.4 27.2,22.2 35.0,25.0 32.3,17.4 37.5,23.3 Z"/>

    <!-- ══ CASA ROSSA: vela + barra ══ -->
    <polygon points="44,74 74,30 74,74" fill="#b02a1c"/>
    <rect x="77" y="35" width="9" height="39" fill="#b02a1c"/>

    <!-- ══ SUNSER: SUNS blu scuro sul cielo, ER rosso scuro sulla casa ══ -->
    <text x="28" y="71" font-family="Arial,Helvetica,sans-serif"
      font-size="11" font-weight="800" letter-spacing="2.2" textLength="56" lengthAdjust="spacingAndGlyphs"><tspan fill="#1c3f57">SUNS</tspan><tspan fill="#7d1310">ER</tspan></text>
  </g>

  <!-- ══ ANTA SINISTRA (aperta verso l'esterno) ══ -->
  <g transform="skewY(-7) translate(-8,7)">
    <rect x="8" y="1" width="19" height="84" rx="1" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.3"/>
    <rect x="11" y="5" width="13" height="76" fill="#eef7fb" stroke="#c9c9c9" stroke-width="0.8"/>
    <g stroke="#9fcfe4" stroke-width="1.1">
      <line x1="12.5" y1="20" x2="22.5" y2="10"/>
      <line x1="12.5" y1="34" x2="22.5" y2="24"/>
      <line x1="12.5" y1="48" x2="22.5" y2="38"/>
    </g>
    <rect x="8.5" y="38" width="2.6" height="10" rx="1.3" fill="#4a4a4a"/>
  </g>

  <!-- ══ ANTA DESTRA (aperta verso l'esterno) ══ -->
  <g transform="skewY(7) translate(85,-7)">
    <rect x="0" y="1" width="19" height="84" rx="1" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.3"/>
    <rect x="3" y="5" width="13" height="76" fill="#eef7fb" stroke="#c9c9c9" stroke-width="0.8"/>
    <g stroke="#9fcfe4" stroke-width="1.1">
      <line x1="4.5" y1="20" x2="14.5" y2="10"/>
      <line x1="4.5" y1="34" x2="14.5" y2="24"/>
      <line x1="4.5" y1="48" x2="14.5" y2="38"/>
    </g>
    <rect x="15.9" y="38" width="2.6" height="10" rx="1.3" fill="#4a4a4a"/>
  </g>

  <!-- ══════════ WORDMARK ══════════ -->
  <text x="124" y="49"
    font-family="Inter,Arial Black,sans-serif"
    font-size="34" font-weight="900" letter-spacing="-1"
    fill="#ffffff">SUNSER</text>
  <text x="126" y="65"
    font-family="Inter,Arial,sans-serif"
    font-size="7.8" font-weight="700" letter-spacing="3.5"
    fill="#7ab51d">INFISSI &amp; SERRAMENTI</text>
</svg>
